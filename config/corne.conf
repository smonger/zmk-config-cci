# Sleep settings
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Debounce: slightly less eager than before to cut chatter double-fires.
# One-shot taps (next/close/new window, new tab, Left/Right) are also tap
# macros in corne.keymap so a held key cannot trigger macOS key-repeat.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15

# Wireless range settings
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Keyboard name
CONFIG_ZMK_KEYBOARD_NAME="CCI"

# Custom display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Uncomment for no animation
# CONFIG_NICE_VIEW_GEM_ANIMATION=n

# For mouse
CONFIG_ZMK_POINTING=y
